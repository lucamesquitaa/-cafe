<div class="beneficioscontainer1">
    <div class="header-section">
        <h4>Benefícios</h4>
        <p class="subtitulo">Resgate brindes exclusivos da cafeteria!</p>
    </div>
    
    <div class="beneficios">
        <div class="beneficio-item destaque">
            <div class="beneficio-icon">
                <i class="bi bi-cup-hot"></i>
            </div>
            <div class="beneficio-content">
                <h5 class="beneficio-titulo">Café grátis</h5>
                <p class="beneficio-descricao">Troque 10 pontos por um café grátis</p>
                <div class="beneficio-badge">
                    <span class="categoria">Bebida</span>
                </div>
            </div>
            <div class="beneficio-custo">
                <span class="pontos">10 pts</span>
                <i class="bi bi-gift-fill status-icon"></i>
            </div>
        </div>

        <div class="beneficio-item">
            <div class="beneficio-icon">
                <i class="bi bi-cake2"></i>
            </div>
            <div class="beneficio-content">
                <h5 class="beneficio-titulo">Aniversário</h5>
                <p class="beneficio-descricao">Um pedaço de bolo no dia do seu Aniversário</p>
                <div class="beneficio-badge">
                    <span class="categoria">Especial</span>
                </div>
            </div>
            <div class="beneficio-custo">
                <span class="pontos">20 pts</span>
                <i class="bi bi-gift-fill status-icon"></i>
            </div>
        </div>

        <div class="beneficio-item">
            <div class="beneficio-icon">
                <i class="bi bi-percent"></i>
            </div>
            <div class="beneficio-content">
                <h5 class="beneficio-titulo">20% OFF</h5>
                <p class="beneficio-descricao">Troque 20 pontos por um desconto de 20%</p>
                <div class="beneficio-badge">
                    <span class="categoria">Desconto</span>
                </div>
            </div>
            <div class="beneficio-custo">
                <span class="pontos">20 pts</span>
                <i class="bi bi-gift-fill status-icon"></i>
            </div>
        </div>
    </div>
</div>
