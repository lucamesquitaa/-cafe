<div class="missaocontainer1">
    <div class="header-section">
        <h4>Complete suas missões</h4>
        <p class="subtitulo">Complete as missões disponíveis para ganhar pontos e benefícios exclusivos!</p>
    </div>
    
    <div class="missoes">
        <div class="missao-item">
            <div class="missao-content">
                <div class="missao-icon">
                    <i class="bi bi-cup-hot"></i>
                </div>
                <div class="missao-info">
                    <p class="missao-descricao">Compre 1 Pão de queijo</p>
                    <span class="missao-categoria">Compras</span>
                </div>
            </div>
            <div class="missao-reward">

                <i class="bi bi-dash-square status-icon"></i>
            </div>
        </div>

        <div class="missao-item">
            <div class="missao-content">
                <div class="missao-icon">
                    <i class="bi bi-star"></i>
                </div>
                <div class="missao-info">
                    <p class="missao-descricao">Avalie a cafeteria</p>
                    <span class="missao-categoria">Engajamento</span>
                </div>
            </div>
            <div class="missao-reward">
                <span class="pontos">5 pts</span>
                <i class="bi bi-dash-square status-icon"></i>
            </div>
        </div>

        <div class="missao-item">
            <div class="missao-content">
                <div class="missao-icon">
                    <i class="bi bi-instagram"></i>
                </div>
                <div class="missao-info">
                    <p class="missao-descricao">Seguir no Instagram</p>
                    <span class="missao-categoria">Social</span>
                </div>
            </div>
            <div class="missao-reward">
                <span class="pontos">5 pts</span>
                <i class="bi bi-dash-square status-icon"></i>
            </div>
        </div>

        <div class="missao-item completed">
            <div class="missao-content">
                <div class="missao-icon">
                    <i class="bi bi-geo-alt"></i>
                </div>
                <div class="missao-info">
                    <p class="missao-descricao">Visite a cafeteria</p>
                    <span class="missao-categoria">Presencial</span>
                </div>
            </div>
            <div class="missao-reward">

            </div>

</div>
