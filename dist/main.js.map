<div class="modern-cafeteria-card">
  <div class="card-image-container">
    <img [src]="cafeteria.image" [alt]="cafeteria.name" class="card-image" loading="lazy" (error)="usarPlaceholder()" />
    <div class="image-overlay"></div>
    <button class="favorite-btn" type="button" [class.active]="cafeteria.fav" (click)="toggleFavorite($event)">
      <i class="bi" [class.bi-heart]="!cafeteria.fav" [class.bi-heart-fill]="cafeteria.fav"></i>
    </button>
  </div>
  
  <div class="card-content">
    <div class="card-header">
      <h3 class="cafeteria-name">{{cafeteria.name}}</h3>
      <div class="rating">
        <div class="stars">
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star"></i>
        </div>
        <span class="rating-text">(4.2)</span>
      </div>
    </div>
    
    
    
    <div class="card-details">
      <span class="cafeteria-description">{{cafeteria.description}}</span>
      <div class="detail-item">
        <i class="bi bi-geo-alt"></i>
        <span>1.2 km</span>
      </div>
    </div>
    
    <div class="card-actions">
      <button class="action-btn primary">
        <i class="bi bi-arrow-right"></i>
        Ver Cardápio
      </button>
    </div>
  </div>
</div>
