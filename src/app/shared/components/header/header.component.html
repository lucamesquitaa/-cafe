
<nav class="navbar navbar-expand-lg navbar-light bg1">
  <i *ngIf="title == 'Clube Cafeína'"  style="font-size: 1.3rem; margin-left: 5px; color: #424242;" class="bi bi-cup-hot"></i>
  <i *ngIf="title != 'Clube Cafeína'" style="font-size: 1.2rem; margin-left: 5px; color: #424242;" class="bi bi-arrow-left" (click)="routerHome()"></i>
  <a class="navbar-brand club1" href="#" style="color: #424242">{{title}}</a>
  
  <div ngbDropdown class="d-inline-block drop1">
    <i *ngIf="title == 'Clube Cafeína'" class="bi bi-person-circle user1" id="dropdownForm1" ngbDropdownToggle style="font-size: 1.2rem; margin-right: 5px; color: #424242;"></i>
    <div *ngIf="title != 'Clube Cafeína'" class="love1">
      <i *ngIf="!isLoved" class="bi bi-heart" style="font-size: 1.2rem; margin-right: 5px; color: #424242;" (click)="toggleLove()"></i>
      <i *ngIf="isLoved" class="bi bi-heart-fill" style="font-size: 1.2rem; margin-right: 5px; color: #424242;" (click)="toggleLove()"></i>
    </div>
    
    <div ngbDropdownMenu aria-labelledby="dropdownForm1" class="drop2">
      <div class="mb-3" *ngIf="false">
          <button type="button" ngbDropdownItem>Login</button>
        </div>
        <div class="mb-3" *ngIf="true">
          <button type="button" ngbDropdownItem>Olá, Luca!</button>
        </div>
      <div class="mb-3" *ngIf="true">
          <button type="button" ngbDropdownItem>Pontos</button>
        </div>
      <div class="dropdown-divider"></div>
      <button type="button" ngbDropdownItem>Sair</button>
    </div>
  </div>
</nav>
