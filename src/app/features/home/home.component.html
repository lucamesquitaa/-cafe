<div class="modern-home">
 
   <div class="section-header">
      <h2>Bem-vindo ao Clube!</h2>
      <p>Escolha uma das opções abaixo para começar sua jornada:</p>
    </div>
  <!-- Quick Actions -->
  <section class="quick-actions">

    <div class="actions-grid">
      <div class="action-card secondary" (click)="navigateTo('catalogo')">
        <div class="card-icon">
          <i class="bi bi-heart"></i>
        </div>
        <div class="card-content">
          <h3>Meus Lugares Favoritos</h3>
          <p>Os lugares que você mais gosta de visitar</p>
        </div>
        <div class="card-arrow">
          <i class="bi bi-arrow-right"></i>
        </div>
      </div>
    </div>

    <div class="actions-grid">
      <div class="action-card primary" (click)="navigateTo('catalogo')">
        <div class="card-icon">
          <i class="bi bi-shop-window"></i>
        </div>
        <div class="card-content">
          <h3>Explorar Catálogo</h3>
          <p>Descubra seus próximos gostos</p>
        </div>
        <div class="card-arrow">
          <i class="bi bi-arrow-right"></i>
        </div>
      </div>
    </div>
  </section>

  

  <!-- Bottom CTA -->
  <section class="bottom-cta">
    <div class="cta-content">
      <h2>Pronto para começar?</h2>
      <p>Explore nosso catálogo completo e encontre o café perfeito</p>
      <button class="cta-button" (click)="navigateTo('catalogo')">
        Explorar
      </button>
    </div>
  </section>
</div>
