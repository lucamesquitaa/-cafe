<div class="containerCatalogo">
  <div class="contentImg">
    <img src="assets/bluecof.png" alt="Café" class="img-fluid">
  </div>
  <div class="input-group mb-3 search1">
    <input type="text" class="form-control inp1" placeholder="Nome da cafeteria" >
      
    <button class="btn btn-outline-secondary" type="button"><i class="bi bi-funnel"></i></button>
    <button class="btn btn-outline-secondary" type="button" ><i class="bi bi-search"></i></button>
  </div>
  <div class="cafeteria">
    <div *ngFor="let cafeteria of cafeterias" >
      <app-item class="item" [cafeteria]="cafeteria" (click)="onCafeteriaClick(cafeteria)"></app-item>
    </div>
    <div *ngFor="let cafeteria of cafeterias" >
      <app-item class="item" [cafeteria]="cafeteria" (click)="onCafeteriaClick(cafeteria)"></app-item>
    </div>
  </div>
</div>
